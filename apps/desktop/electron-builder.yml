appId: local.jeffpostman.app
productName: JEFF Postman
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# o atalho do terminal: jeff-postman.cmd run colecao.json (usa o Node embutido no app)
extraResources:
  - from: build/jeff-postman.cmd
    to: jeff-postman.cmd
compression: maximum
# só as traduções do Chromium que o app usa (as outras ~50 MB não fazem falta)
electronLanguages:
  - pt-BR
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
